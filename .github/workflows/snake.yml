# Draws the contribution "snake" shown on the profile README.
# Runs daily, on every push, and on demand; results go to the `output` branch.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/snake-dark.svg?color_snake=#FFD23F&color_dots=#1b1640,#3A86FF,#9B5DE5,#FF4D8D,#2EE59D&color_background=#0d1117
            dist/snake-light.svg?color_snake=#FF7A1A&color_dots=#ebedf0,#00D1FF,#3A86FF,#9B5DE5,#FF4D8D

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
